<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --lv4: #3d7bff; --lv3: #74c7f5; --lv2: #f0a020; --lv1: #1fb866;
  --bg: #f5f6fa;
  --bg-glow: rgba(109, 94, 252, .14);
  --surface: #ffffff;
  --surface-2: #f0f1f6;
  --surface-3: #e6e8f0;
  --line: rgba(15, 18, 30, .08);
  --line-strong: rgba(15, 18, 30, .14);
  --text: #11131a;
  --muted: #5f6578;
  --faint: #9298aa;
  --accent: #6d5efc;
  --accent-ink: #ffffff;
  --again: #ef4f5a;
  --hard: #f0a020;
  --good: #1fb866;
  --easy: #3b82f6;
  --shadow-sm: 0 1px 2px rgba(15, 18, 30, .06), 0 2px 8px rgba(15, 18, 30, .04);
  --shadow-lg: 0 24px 60px -18px rgba(15, 18, 30, .25), 0 8px 20px -10px rgba(15, 18, 30, .12);
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 24px;
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}

:root[data-theme='dark'] {
  --bg: #0b0c11;
  --bg-glow: rgba(109, 94, 252, .22);
  --surface: #14161e;
  --surface-2: #1b1e28;
  --surface-3: #252936;
  --line: rgba(255, 255, 255, .07);
  --line-strong: rgba(255, 255, 255, .13);
  --text: #eef0f7;
  --muted: #9aa0b4;
  --faint: #636a80;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 30px 70px -20px rgba(0, 0, 0, .7), 0 10px 24px -12px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: -20vh -10vw auto;
  height: 70vh;
  background: radial-gradient(60% 60% at 30% 30%, var(--bg-glow), transparent 70%),
    radial-gradient(40% 50% at 85% 10%, color-mix(in srgb, var(--bg-glow) 60%, transparent), transparent 70%);
  pointer-events: none;
  z-index: 0;
  transition: background .6s var(--ease);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
[hidden] { display: none !important; }

#app { position: relative; z-index: 1; min-height: 100vh; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; background: none; border: 0; padding: 0; }
.mark {
  width: 28px; height: 28px; border-radius: 8px; position: relative;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #22d3ee));
  box-shadow: 0 6px 16px -6px var(--accent);
}
.mark::after { content: ''; position: absolute; inset: 7px 6px 9px 9px; border-radius: 3px; background: rgba(255, 255, 255, .9); transform: rotate(-8deg); }
.spacer { flex: 1; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: transform .15s var(--ease), background .2s, border-color .2s, box-shadow .2s, opacity .2s;
}
.btn:hover { border-color: color-mix(in srgb, var(--text) 25%, transparent); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: 0 8px 20px -10px var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--again); }
.btn.lg { height: 48px; padding: 0 22px; border-radius: 14px; font-size: 15px; }
.btn.sm { height: 32px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
.icon-btn { width: 40px; padding: 0; }
.icon-btn.sm { width: 32px; }
.btn svg, .icon svg { width: 18px; height: 18px; flex: none; }
.btn.sm svg { width: 16px; height: 16px; }

/* ---------- forms ---------- */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, .textarea, .select {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px;
  padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.input { height: 44px; }
.textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.select { height: 44px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); }
.error { color: var(--again); font-size: 14px; font-weight: 500; min-height: 20px; }

.seg { display: inline-flex; padding: 4px; gap: 4px; background: var(--surface-2); border-radius: 12px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s, box-shadow .2s; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch i { width: 38px; height: 22px; border-radius: 99px; background: var(--surface-3); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .25s var(--ease); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }

/* ---------- auth ---------- */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
.auth-card { width: 100%; max-width: 400px; }
.auth h1 { font-family: var(--display); font-size: 34px; letter-spacing: -.035em; line-height: 1.1; margin: 22px 0 8px; }
.auth p.lead { color: var(--muted); margin: 0 0 26px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-lg); }
.auth .seg { width: 100%; margin-bottom: 20px; }
.auth .seg button { flex: 1; }
.gbtn { display: flex; justify-content: center; min-height: 44px; margin-bottom: 4px; transition: opacity .2s; color-scheme: light; }
.gbtn iframe { color-scheme: light; background: transparent !important; }
.or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12.5px; margin: 16px 0 18px; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line-strong); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }

/* ---------- home ---------- */
.home { padding: 28px 0 80px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-bottom: 28px; }
.hero-main {
  position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 28px;
  background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 92%, #000) 0%, color-mix(in srgb, var(--accent) 70%, #22d3ee) 100%);
  color: #fff; box-shadow: 0 30px 60px -30px var(--accent);
  display: flex; flex-direction: column; justify-content: space-between; min-height: 230px;
}
.hero-main::after { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 65%); }
.hero-main .eyebrow { font-size: 13px; font-weight: 600; opacity: .85; }
.hero-main .big { font-family: var(--display); font-size: 64px; font-weight: 700; letter-spacing: -.05em; line-height: 1; margin: 8px 0 4px; }
.hero-main .sub { opacity: .85; font-size: 14px; min-height: 2.9em; line-height: 1.45; }
.hero-main .btn { background: #fff; color: #111; border: 0; }
.hero-main .btn.ghost-light { background: rgba(255, 255, 255, .16); color: #fff; border: 1px solid rgba(255, 255, 255, .35); }
.hero-main .btn.ghost-light:hover { background: rgba(255, 255, 255, .24); }
.hero-main .btn:disabled { opacity: .6; }
.hero-side { display: grid; grid-template-rows: auto 1fr; gap: 16px; min-width: 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; align-items: center; gap: 14px; }
.stat .num { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.stat .lbl { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.ring { width: 46px; height: 46px; flex: none; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--surface-3); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset .8s var(--ease); }
.flame { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--hard) 16%, transparent); color: var(--hard); flex: none; }
.flame svg { width: 24px; height: 24px; }
.heat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.heat-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow: hidden; }
.heat-grid i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-3); }
.heat-grid i[data-l='1'] { background: color-mix(in srgb, var(--accent) 30%, var(--surface-3)); }
.heat-grid i[data-l='2'] { background: color-mix(in srgb, var(--accent) 55%, var(--surface-3)); }
.heat-grid i[data-l='3'] { background: color-mix(in srgb, var(--accent) 80%, var(--surface-3)); }
.heat-grid i[data-l='4'] { background: var(--accent); }
.heat-grid i.future { visibility: hidden; }

.quote { margin: 0 0 28px; padding: 0 4px; font-size: 15px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
.quote b { color: var(--text); font-weight: 500; }

.section-head { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
.section-head h2 { font-family: var(--display); font-size: 22px; letter-spacing: -.03em; margin: 0; }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.deck {
  --c: var(--accent);
  position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r); padding: 18px; min-height: 150px; display: flex; flex-direction: column;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;
  overflow: hidden;
}
.deck::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--c); opacity: .9; }
.deck:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--c) 35%, var(--line)); }
.deck .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }
.deck h3 { margin: 14px 0 2px; font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.deck .meta { color: var(--muted); font-size: 13px; }
.deck .counts { display: flex; gap: 6px; margin-top: auto; padding-top: 16px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.due { background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color: color-mix(in srgb, var(--c, var(--accent)) 80%, var(--text)); }
.chip.shared { background: color-mix(in srgb, var(--hard) 16%, transparent); color: color-mix(in srgb, var(--hard) 75%, var(--text)); }
.chip.pub { background: color-mix(in srgb, var(--good) 15%, transparent); color: color-mix(in srgb, var(--good) 75%, var(--text)); }
.catalog { display: grid; gap: 8px; max-height: 60vh; overflow: auto; }
.cat-item { --c: var(--accent); display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.cat-item .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 6px; }
.cat-main { display: grid; gap: 2px; min-width: 0; }
.cat-main b { overflow-wrap: anywhere; }
.cat-preview { margin-top: 8px; }
@media (max-width: 600px) { .cat-item { grid-template-columns: auto minmax(0, 1fr); } .cat-item .btn { grid-column: 2; justify-self: start; } }
.chip.new { background: color-mix(in srgb, var(--easy) 14%, transparent); color: color-mix(in srgb, var(--easy) 85%, var(--text)); }
.deck .go { position: absolute; right: 14px; bottom: 14px; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #fff; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s var(--ease); border: 0; }
.deck .go svg { width: 18px; height: 18px; }
.deck:hover .go, .deck:focus-within .go { opacity: 1; transform: none; }
@media (hover: none) { .deck .go { opacity: 1; transform: none; } }
.deck.add { align-items: center; justify-content: center; gap: 8px; border-style: dashed; border-color: var(--line-strong); background: transparent; color: var(--muted); font-weight: 600; }
.deck.add::before { display: none; }
.deck.add svg { width: 22px; height: 22px; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; }

/* ---------- deck page ---------- */
.deckpage { padding: 24px 0 80px; }
.deck-hero { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.deck-hero h1 { font-family: var(--display); font-size: 32px; letter-spacing: -.035em; line-height: 1.1; margin: 4px 0 6px; overflow-wrap: anywhere; }
.deck-hero .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 16px; flex: none; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
.search { position: relative; flex: 1; min-width: 200px; }
.search svg { position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: var(--faint); }
.search .input { padding-left: 38px; }
.cards { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 210px; gap: 16px; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.crow:last-child { border-bottom: 0; }
.crow:hover { background: var(--surface-2); }
.crow .f { font-weight: 600; }
.crow .b { color: var(--muted); }
.crow .f, .crow .b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .tags { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.more { padding: 14px; text-align: center; }

/* ---------- study ---------- */
.study { min-height: 100vh; display: flex; flex-direction: column; }
.study-top { display: flex; align-items: center; gap: 12px; height: 64px; }
.progress { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .5s var(--ease); }
.qcounts { display: flex; gap: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.qcounts .n { color: var(--easy); } .qcounts .l { color: var(--again); } .qcounts .r { color: var(--good); }
.qcounts span.cur { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0 24px; perspective: 1600px; }
.flip { position: relative; width: 100%; max-width: 640px; min-height: min(56vh, 440px); touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.flip input { -webkit-user-select: text; user-select: text; }
.flip { cursor: pointer; }
.flip .inner { position: relative; width: 100%; min-height: inherit; transform-style: preserve-3d; transition: transform .34s cubic-bezier(.2, .85, .2, 1); }
.flip.flipped .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background:
    radial-gradient(110% 70% at 12% -12%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%),
    radial-gradient(80% 55% at 112% 6%, color-mix(in srgb, #3b82f6 16%, transparent), transparent 60%),
    var(--surface);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
  border-radius: 28px;
  box-shadow: var(--shadow-lg), 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent);
  display: flex; flex-direction: column; padding: 26px 28px; overflow: auto;
}
.face::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255, 255, 255, .09), transparent 45%); pointer-events: none; }
.face.back { transform: rotateY(180deg); }
.face-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.face-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 16px 0; }
.face-text { font-family: var(--display); font-size: clamp(24px, 4.4vw, 40px); font-weight: 600; letter-spacing: -.025em; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; }
.face-text.long { font-size: clamp(17px, 2.4vw, 22px); font-family: var(--font); font-weight: 500; letter-spacing: 0; line-height: 1.5; text-align: left; }
.face .q-small { color: var(--muted); font-size: 15px; white-space: pre-wrap; }
.face-img { max-height: 220px; border-radius: 14px; object-fit: contain; }
.audio-btn { width: 56px; height: 56px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); display: grid; place-items: center; }
.audio-btn svg { width: 24px; height: 24px; }
.tap-hint { font-size: 13px; color: var(--faint); text-align: center; }
.answer-in { width: 100%; max-width: 420px; display: flex; gap: 8px; }
.answer-in .input { height: 50px; font-size: 17px; text-align: center; }
.verdict { font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 99px; }
.verdict.exact { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.verdict.close { color: var(--hard); background: color-mix(in srgb, var(--hard) 14%, transparent); }
.verdict.wrong { color: var(--again); background: color-mix(in srgb, var(--again) 14%, transparent); }
.typed-was { color: var(--muted); font-size: 15px; }
.typed-was s { color: var(--again); }
.choices { width: 100%; max-width: 480px; display: grid; gap: 10px; }
.choice { text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 14px 16px; font-weight: 500; display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s, transform .15s var(--ease); }
.choice:hover { border-color: var(--accent); }
.choice:active { transform: scale(.98); }
.choice kbd { font-family: var(--font); font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.choice.wrong { border-color: var(--again); background: color-mix(in srgb, var(--again) 12%, var(--surface)); }
.choice:disabled { cursor: default; }

.dock { width: 100%; max-width: 640px; margin-top: 22px; min-height: 76px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.grades.two { grid-template-columns: 1fr 1fr; }
.grade-wrap { display: grid; gap: 6px; justify-items: stretch; }
.grade {
  border: 1px solid var(--line-strong); border-radius: 16px; min-height: 52px; padding: 0 6px;
  background: var(--surface-2); color: var(--text); font-weight: 800; font-size: 16px;
  transition: transform .12s var(--ease), background .15s, border-color .15s;
}
.grade:hover { background: var(--surface-3); border-color: color-mix(in srgb, var(--text) 22%, transparent); }
.grade:active { transform: scale(.97); }
.grade.suggest { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.grade-hint { text-align: center; font-size: 12.5px; font-weight: 700; color: var(--faint); }
.faces { display: flex; gap: 14px; justify-content: center; font-size: 24px; user-select: none; -webkit-user-select: none; margin-bottom: 16px; }
.faces span { opacity: .35; transform: scale(.9); filter: saturate(.6); transition: opacity .15s, transform .15s, filter .15s; }
.faces span.on { opacity: 1; transform: scale(1.25); filter: none; }
.row-face { font-size: 16px; line-height: 1; width: 20px; text-align: center; }
.levels { margin: 0 0 28px; }
.levels-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.levels-head h2 { font-family: var(--display); font-size: clamp(18px, 4.6vw, 22px); letter-spacing: -.03em; margin: 0; }
.levels-head .switch { white-space: nowrap; }
.level-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.level { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px 12px 12px; display: grid; justify-items: center; gap: 4px; min-width: 0; }
.level .lv-face { font-size: 34px; line-height: 1.1; }
.level b { font-family: var(--display); font-size: 17px; letter-spacing: -.02em; margin-bottom: 8px; }
.level .btn { width: 100%; justify-content: center; }
.level .lv-go { background: color-mix(in srgb, var(--lc) 18%, var(--surface-2)); color: var(--text); border-color: color-mix(in srgb, var(--lc) 40%, transparent); }
.level .lv-go:hover:not(:disabled) { background: color-mix(in srgb, var(--lc) 30%, var(--surface-2)); }
.level .lv-worse { color: var(--muted); font-size: 12.5px; }
.level .btn:disabled { opacity: .4; }
.lv-worse-gap { height: 32px; }
.lv4 { --lc: var(--lv4); } .lv3 { --lc: var(--lv3); } .lv2 { --lc: var(--lv2); } .lv1 { --lc: var(--lv1); }
.level small { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
.chosen { margin-top: 10px; font-size: 12.5px; opacity: .8; position: relative; z-index: 1; }
.deck .pick { position: absolute; top: 12px; right: 12px; z-index: 2; cursor: pointer; }
.pick input { display: none; }
.pick i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-strong); background: var(--surface); transition: background .15s, border-color .15s; }
.pick input:checked + i { background: var(--c); border-color: var(--c); }
.pick input:checked + i::after { content: ''; width: 10px; height: 6px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: translate(0, -1px) rotate(-45deg); }
.deck:not(.picked) { opacity: .55; }
.deck:not(.picked):hover { opacity: .85; }
.show-btn { width: 100%; height: 56px; border-radius: 16px; font-size: 16px; }
.keys { margin-top: 12px; text-align: center; font-size: 12px; color: var(--faint); }
.keys kbd { font-family: var(--font); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); margin: 0 2px; }
@media (hover: none) { .keys { display: none; } }
.swipe-hint { position: absolute; top: 22px; font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 10px; border: 2px solid; opacity: 0; z-index: 3; pointer-events: none; }
.swipe-hint.l { left: 22px; color: var(--again); transform: rotate(-10deg); }
.swipe-hint.r { right: 22px; color: var(--good); transform: rotate(10deg); }

.done { text-align: center; max-width: 460px; margin: 0 auto; padding: 14vh 0 40px; }
.done .burst { width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 28px; display: grid; place-items: center; background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); animation: pop .6s var(--ease); }
.done .burst svg { width: 40px; height: 40px; }
.chroma { position: relative; }
.chroma::before {
  content: ''; position: absolute; inset: -3px; border-radius: 31px; padding: 3px;
  background: linear-gradient(90deg, #7c3aed, #3b82f6, #10b981, #ec4899, #7c3aed); background-size: 300% 300%;
  animation: chroma 3s linear infinite;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
}
@keyframes chroma { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.done h1 { font-family: var(--display); font-size: 34px; letter-spacing: -.035em; margin: 0 0 8px; }
.done-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0; }
.done-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 8px; }
.done-stats b { display: block; font-family: var(--display); font-size: 24px; letter-spacing: -.03em; }
.done-stats span { font-size: 12.5px; color: var(--muted); }
@keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: none; opacity: 1; } }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8, 9, 14, .5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .2s ease; }
.modal { width: 100%; max-width: 560px; max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--line); animation: rise .3s var(--ease); }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 0; }
.modal-head h2 { font-family: var(--display); font-size: 20px; letter-spacing: -.02em; margin: 0; flex: 1; }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; gap: 10px; padding: 0 20px 20px; flex-wrap: wrap; align-items: center; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
@media (max-width: 600px) {
  .scrim { align-items: flex-end; padding: 0; }
  .modal { max-height: 92vh; border-radius: 22px 22px 0 0; animation: sheet .32s var(--ease); }
  @keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
}

.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { display: grid; gap: 8px; }
.side .lab { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); }
.media-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.media-row:empty { display: none; }
.thumb { position: relative; height: 56px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); display: grid; place-items: center; background: var(--surface-2); min-width: 56px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.thumb img { height: 56px; width: auto; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .65); color: #fff; display: grid; place-items: center; padding: 0; }
.thumb button svg { width: 12px; height: 12px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 0; position: relative; transition: transform .15s var(--ease); }
.swatch:hover { transform: scale(1.1); }
.swatch.on::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--text); }
.preview-list { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
.preview-list div { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
.preview-list div:last-child { border-bottom: 0; }
.danger-zone { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px; }

/* ---------- menu, toast, loader ---------- */
.menu { position: fixed; z-index: 60; min-width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; animation: rise .18s var(--ease); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 9px 10px; border-radius: 9px; font-size: 14px; font-weight: 500; text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--again); }
.menu svg { width: 16px; height: 16px; color: var(--muted); }
.menu button.danger svg { color: var(--again); }
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 70; display: grid; gap: 8px; justify-items: center; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0); }
.toast { background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lg); animation: rise .25s var(--ease); max-width: calc(100vw - 40px); }
.toast.err { background: var(--again); color: #fff; }
.boot { min-height: 100vh; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.btn .spinner { width: 16px; height: 16px; border-width: 2px; border-color: rgba(255, 255, 255, .35); border-top-color: currentColor; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync { font-size: 12px; color: var(--faint); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.sync.busy i { background: var(--hard); animation: blink 1s infinite; }
.sync.off i { background: var(--again); }
@keyframes blink { 50% { opacity: .3; } }

.appear > * { animation: rise .45s var(--ease) both; }
.appear > *:nth-child(2) { animation-delay: .04s; }
.appear > *:nth-child(3) { animation-delay: .08s; }
.appear > *:nth-child(4) { animation-delay: .12s; }
.appear > *:nth-child(5) { animation-delay: .16s; }
.calm .appear > * { animation: none; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .wrap { padding: 0 16px; }
  .hero-main { padding: 22px; min-height: 200px; }
  .hero-main .big { font-size: 52px; }
  .sides, .grid2 { grid-template-columns: 1fr; }
  .crow { grid-template-columns: minmax(0, 1fr) auto; }
  .crow .b { grid-column: 1; grid-row: 2; margin-top: -10px; }
  .crow .tags { grid-row: 1 / span 2; grid-column: 2; }
  .face { padding: 22px 20px; border-radius: 24px; }
  .grade { min-height: 48px; font-size: 15px; border-radius: 14px; }
  .grade-hint { font-size: 11px; }
  .level-row { gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .level .lv-face { font-size: 28px; }
  .level small { font-size: 11px; }
  .level { padding: 12px 6px 8px; }
  .level .btn { font-size: 12px; padding-left: 4px; padding-right: 4px; }
  .flip { min-height: 64vh; min-height: 64svh; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* study mode switch in the hero */
.hero-main .seg.mode { background: rgba(255, 255, 255, .14); margin-bottom: 10px; position: relative; z-index: 1; }
.hero-main .seg.mode button { color: rgba(255, 255, 255, .82); }
.hero-main .seg.mode button { position: relative; z-index: 1; background: transparent !important; box-shadow: none !important; transition: color .25s; }
.hero-main .seg.mode button.on { color: #111; }
.seg-ind { position: absolute; left: 0; top: 4px; bottom: 4px; border-radius: 9px; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); transition: transform .35s var(--ease), width .35s var(--ease); z-index: 0; }
.hero-main .seg.mode { padding: 4px; }

/* folders: a wallet of deck cards that fans open in place */
.decks { align-items: start; }
.wallet-tile { --fc: var(--accent); position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 14px 16px; cursor: pointer; transition: border-color .3s, box-shadow .3s, transform .25s var(--ease); }
.wallet-tile:hover { box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--fc) 35%, var(--line)); }
.wallet-tile.open { border-color: color-mix(in srgb, var(--fc) 55%, var(--line)); cursor: default; }
.wallet-tile.open .whead { cursor: pointer; }
.whead { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 12px; --c: var(--fc); }
.whead .pick { flex: none; margin-top: 2px; }
.wtitle { flex: 1; min-width: 0; }
.wtitle h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.wtitle .meta { color: var(--muted); font-size: 12.5px; }
.fmore { flex: none; width: 32px; height: 32px; margin: -4px -4px 0 0; border-radius: 10px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.fmore svg { width: 18px; height: 18px; }
.fmore:hover { background: var(--surface-2); color: var(--text); }
.wstack { position: relative; transition: height .55s var(--ease); }
.wc { position: absolute; left: 0; right: 0; top: 0; height: 120px; border-radius: 16px; padding: 12px 14px; color: #fff;
  background: linear-gradient(135deg, var(--dc), color-mix(in srgb, var(--dc) 55%, #000)); border: 1px solid rgba(255, 255, 255, .16);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, .3); display: flex; flex-direction: column;
  transform: translateY(calc(var(--ci) * 30px)); transition: transform .55s var(--spring, cubic-bezier(.34, 1.3, .5, 1)), opacity .3s; }
.wc.extra { opacity: 0; pointer-events: none; }
.wallet-tile:not(.open):hover .wc { transform: translateY(calc(var(--ci) * 35px)); }
.wallet-tile.open .wc { transform: translateY(calc(var(--i) * 132px)); opacity: 1; pointer-events: auto; cursor: pointer; }
.wtop { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding-right: 0; transition: padding .3s; }
.wtop b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wtop span { font-size: 12px; opacity: .9; white-space: nowrap; }
.wallet-tile.open .wtop { padding-right: 36px; }
.wbot { margin-top: auto; padding-right: 0; transition: padding .3s; }
.wallet-tile.open .wbot { padding-right: 46px; }
.wbot small { display: block; margin-bottom: 6px; font-size: 12px; opacity: .85; }
.wbar { display: flex; gap: 2px; height: 5px; border-radius: 99px; overflow: hidden; background: rgba(0, 0, 0, .25); }
.wpick, .wgo { position: absolute; opacity: 0; pointer-events: none; transition: opacity .25s; }
.wallet-tile.open .wpick, .wallet-tile.open .wgo { opacity: 1; pointer-events: auto; }
.wpick { top: 10px; right: 10px; --c: rgba(0, 0, 0, .35); }
.wpick i { border-color: rgba(255, 255, 255, .8); background: rgba(0, 0, 0, .15); }
.wgo { right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .95); color: #111; display: grid; place-items: center; }
.wgo svg { width: 16px; height: 16px; }
.wextra { margin-top: 10px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.wallet-tile.open .wextra { display: none; }
.wallet-tile:not(.picked) .wstack { opacity: .55; }
.pick input[data-some] + i { background: var(--c); border-color: var(--c); }
.pick input[data-some] + i::after { content: ''; width: 10px; height: 2.5px; background: #fff; border-radius: 2px; }
.folder-picks { display: grid; gap: 6px; max-height: 320px; overflow: auto; }
.fp { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); cursor: pointer; }
.fp b { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fp small { color: var(--muted); white-space: nowrap; }
.fp .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.fp input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.mode-desc { margin: 0 0 18px; max-width: 420px; min-height: 2.9em; font-size: 14px; line-height: 1.45; font-weight: 500; opacity: .95; position: relative; z-index: 1; }

/* face badges: each face on its level colour */
.fbadge { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: 19px; line-height: 1; background: color-mix(in srgb, var(--lc) 30%, var(--surface-2)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--lc) 70%, transparent); flex: none; }
.fbadge.big { width: 58px; height: 58px; font-size: 32px; margin-bottom: 4px; }
.fbadge.sm { width: 24px; height: 24px; font-size: 13px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--lc) 70%, transparent); }
.pts { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
.pts .dots { display: inline-flex; gap: 6px; }
.pts .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3, var(--surface-2)); box-shadow: inset 0 0 0 1.5px var(--line-strong); transition: background .25s; }
.pts .dots i.on { background: var(--good); box-shadow: none; }
.pts-lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
/* two-button dock */
.grades.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 460px; margin-left: auto; margin-right: auto; }
.grades.two.one { grid-template-columns: minmax(0, 1fr); max-width: 260px; }
/* true / false */
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; width: 100%; max-width: 420px; }
.tf-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 10px; border-radius: 16px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font: 600 14px var(--font, inherit); cursor: pointer; transition: transform .15s, background .2s, border-color .2s; }
.tf-btn b { font-size: 30px; line-height: 1; }
.tf-btn.t b { color: var(--good); } .tf-btn.f b { color: var(--again); }
.tf-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--muted); }
.tf-btn.right { background: color-mix(in srgb, var(--good) 22%, var(--surface-2)); border-color: var(--good); }
.tf-btn.wrong { background: color-mix(in srgb, var(--again) 22%, var(--surface-2)); border-color: var(--again); }
.tf-ans { display: inline-flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 750; letter-spacing: -.02em; margin: 6px 0 4px; }
.tf-ans b { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; font-size: 28px; }
.tf-ans.t b { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.tf-ans.f b { background: color-mix(in srgb, var(--again) 22%, transparent); color: var(--again); }
.tf-ex { margin: 14px auto 0; max-width: 560px; font-size: 16px; line-height: 1.5; color: var(--text); opacity: .9; white-space: pre-wrap; }
.levels-explain { margin: -4px 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.5; max-width: 720px; }
.levels-explain b { color: var(--text); font-weight: 650; }
.level .lv-rule { font-size: 11.5px; color: var(--faint); text-align: center; margin: -2px 0 4px; }

/* Focus: colour tiles + one info explainer */
.levels-head { position: relative; display: flex; align-items: center; gap: 10px; }
.info-btn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--faint); background: none; color: var(--muted); font: italic 700 12.5px Georgia, serif; cursor: pointer; padding: 0; }
.info-btn:hover, .info-btn[aria-expanded="true"] { border-color: var(--text); color: var(--text); }
.ftiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.ftile { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; color: #fff; min-height: 210px; display: flex; flex-direction: column;
  background: linear-gradient(150deg, var(--lc), color-mix(in srgb, var(--lc) 45%, #0b0c10)); box-shadow: 0 14px 34px rgba(0, 0, 0, .3); transition: transform .3s var(--ease), box-shadow .3s; }
.ftile:hover { transform: translateY(-4px) rotate(-.5deg); box-shadow: 0 20px 44px rgba(0, 0, 0, .4); }
.ftile::before { content: ''; position: absolute; inset: 0; background: radial-gradient(240px circle at 85% 0%, rgba(255, 255, 255, .25), transparent 60%); pointer-events: none; }
.ftile.ft-empty { filter: saturate(.75); }

/* quote in the top bar */
.tb-quote { flex: 1 1 auto; min-width: 0; margin-left: 18px; font-size: 13.5px; color: var(--muted); font-style: italic; overflow: hidden; }
.tb-quote span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .45s, transform .45s var(--ease); }
.tb-quote span.out { opacity: 0; transform: translateY(-6px); }
.topbar .spacer { flex: 0 1 12px; }
@media (max-width: 480px) { .tb-quote { font-size: 12px; margin-left: 10px; } }
/* hero go button with decks chosen inside */
.go-btn { height: auto !important; padding: 10px 20px 10px 16px !important; gap: 12px; }
.go-btn span { display: grid; text-align: left; line-height: 1.2; }
.go-btn small { font-size: 12px; font-weight: 600; opacity: .65; }
/* heat card cog + home cards */
.heat-r { display: inline-flex; align-items: center; gap: 8px; }
.heat-cog { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; }
.heat-cog svg { width: 15px; height: 15px; }
.heat-cog:hover { background: var(--surface-2); color: var(--text); }
.home-cog { align-self: start; justify-self: end; }
.hero.solo { grid-template-columns: minmax(0, 1fr); }
.hero.solo .home-cog { margin-left: auto; align-self: center; }
.hero-side.no-heat { grid-template-rows: auto auto; }
.hc-list { display: grid; gap: 10px; }
/* explainer above everything; faces editor */
.levels { position: relative; z-index: 6; }
.sx-pop { z-index: 70; }
.sx-foot { margin-top: 12px; display: flex; justify-content: flex-end; }
.sx-foot .btn { background: #fff; color: #16181d; border-color: #d6d9e0; }
.fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; transition: opacity .2s; }
.fx-grid.off { opacity: .4; pointer-events: none; }
.fx { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
.fx-dot { grid-row: span 2; width: 14px; height: 14px; border-radius: 50%; background: var(--lc); }
.fx .input { height: 38px; font-size: 20px; }
.fbadge:empty { width: 22px; height: 22px; background: var(--lc); }
.sx-b:empty { background: var(--lc); }
/* tabs: each a slightly different shade */
.hero-main .seg.mode button[data-mode="free"] { background: rgba(0, 0, 0, .04) !important; }
.hero-main .seg.mode button[data-mode="focus"] { background: rgba(0, 0, 0, .1) !important; }
.hero-main .seg.mode button[data-mode="mission"] { background: rgba(0, 0, 0, .17) !important; }

/* fade between light and dark */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; animation-timing-function: ease; }
html.theme-fade *, html.theme-fade *::before, html.theme-fade *::after { transition: background-color .45s ease, color .45s ease, border-color .45s ease, fill .45s ease, stroke .45s ease !important; }

/* true / false answers in the dock under the card */
.tf-dock .tf-btn { flex-direction: row; justify-content: center; gap: 10px; padding: 0 14px; }
.tf-dock .tf-btn b { font-size: 22px; }

/* hero body takes the shade of the selected tab */
.hero-main { transition: box-shadow .45s ease; }

/* the selected tab is the same colour as the box; the others sit a little darker */
.hero-main .seg.mode { background: none !important; box-shadow: none; }
.hero-main .seg.mode { box-shadow: none; }
.hero-main .seg.mode .seg-ind { background: none; box-shadow: none; }
.hero-main .seg.mode button:not(.on) { box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, .12) !important; }
.hero-main .seg.mode button { transition: color .25s, background .45s, box-shadow .45s; }
/* drag decks onto folders */
.deck.dragging, .wc.dragging { opacity: .4; }
.wallet-tile.drop-on { border-color: var(--accent) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), var(--shadow-lg); transform: scale(1.02); }
.decks.drop-on { outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 8px; border-radius: 12px; }
body.is-dragging .wallet-tile:not(.drop-on) { border-style: dashed; }
/* selected tab shows the box exactly; the others are each a little darker, by a different amount */
.hero-main .seg.mode button.on { background: none !important; box-shadow: none !important; }
.hero-main .seg.mode button[data-mode="free"]:not(.on) { background: rgba(0, 0, 0, .1) !important; box-shadow: none !important; }
.hero-main .seg.mode button[data-mode="focus"]:not(.on) { background: rgba(0, 0, 0, .15) !important; box-shadow: none !important; }
.hero-main .seg.mode button[data-mode="mission"]:not(.on) { background: rgba(0, 0, 0, .2) !important; box-shadow: none !important; }

/* each mode has its own colour; the box fades between them and the selected tab matches it */
@property --h1 { syntax: '<color>'; inherits: true; initial-value: #5b4fe0; }
@property --h2 { syntax: '<color>'; inherits: true; initial-value: #4f8cff; }
.hero-main { --h1: #5b4fe0; --h2: #4f8cff; background: linear-gradient(140deg, var(--h1) 0%, var(--h2) 100%) !important; box-shadow: 0 30px 60px -30px var(--h1) !important; transition: --h1 .5s ease, --h2 .5s ease, box-shadow .5s ease; }
.hero-main.m-focus { --h1: #0e8a4a; --h2: #27a35c; }
.hero-main.m-mission { --h1: #1565d8; --h2: #1590d8; }
.hero-main .seg.mode button[data-mode="free"] { --tc: #5b4fe0; }
.hero-main .seg.mode button[data-mode="focus"] { --tc: #0e8a4a; }
.hero-main .seg.mode button[data-mode="mission"] { --tc: #1565d8; }
.hero-main .seg.mode button[data-mode]:not(.on) { background: color-mix(in srgb, var(--tc) 78%, #0b0c10) !important; color: rgba(255, 255, 255, .78); }
.hero-main .seg.mode button[data-mode]:not(.on):hover { background: color-mix(in srgb, var(--tc) 90%, #0b0c10) !important; color: #fff; }
/* drag ghost */
.drag-ghost { position: fixed !important; left: 0; top: 0; z-index: 200; pointer-events: none; margin: 0; opacity: .95; box-shadow: 0 24px 50px rgba(0, 0, 0, .45) !important; transition: none !important; animation: none !important; will-change: transform; transform-origin: 50% 20%; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
/* phones: more room under the top bar */
@media (max-width: 600px) { .home { padding-top: 26px; } }
/* settings */
.set-sec { padding: 4px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.set-sec:last-of-type { border-bottom: 0; margin-bottom: 0; }
.set-h { font-size: 11.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.set-sec.danger .set-h { color: var(--again); }
.set-email { font-size: 13px; color: var(--muted); margin-top: -4px; }
.set-email b { color: var(--text); font-weight: 600; }
.set-theme { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
.set-rows { display: grid; gap: 6px; }
.set-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; text-align: left; cursor: pointer; transition: border-color .2s, background .2s; }
.set-row:hover { border-color: var(--line-strong); }
.set-row > svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.set-row > svg:last-child { width: 16px; height: 16px; margin-left: auto; transition: transform .2s; }
.set-row.open > svg:last-child { transform: rotate(90deg); }
.set-row span { display: grid; gap: 2px; font-weight: 600; font-size: 14px; }
.set-row small { font-weight: 500; font-size: 12px; color: var(--muted); }
.set-sec.danger .set-row > svg:first-child, .set-sec.danger .set-row span { color: var(--again); }
.set-sec.danger .set-row small { color: var(--muted); }
.set-panel { padding: 4px 2px 6px; }

/* minimalist: every coloured surface dulled to soft greys */
.set-min { margin-top: 4px; align-items: flex-start; }
.set-min span { display: grid; gap: 2px; } .set-min small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
html.minimal { --accent: #7c818c; --bg-glow: transparent; }
html.minimal .hero-main, html.minimal .ftile, html.minimal .deck.solid, html.minimal .wc, html.minimal .disc-top,
html.minimal .fbadge, html.minimal .sx-b, html.minimal .fr-av, html.minimal .chip, html.minimal .mark, html.minimal .flame,
html.minimal .heat-grid, html.minimal .ring, html.minimal .grade, html.minimal .tf-btn, html.minimal .sbar-track, html.minimal .pick i,
html.minimal .btn.primary, html.minimal .dots, html.minimal .fbar, html.minimal .wbar, html.minimal .deck .dot { filter: saturate(.12); }
html.minimal .hero-main { filter: saturate(.12) brightness(.82); }
html.minimal .ftile, html.minimal .deck.solid, html.minimal .wc { filter: saturate(.12) brightness(.85); }
html.minimal .flip, html.minimal .study { --accent: #7c818c; }
html { transition: none; }

/* ================= study: Glass ================= */
.bg-blobs { display: none; }
html.study-on { --gl-bg: #06070d; --gl-card-a: rgba(255, 255, 255, .11); --gl-card-b: rgba(255, 255, 255, .04); --gl-edge: rgba(255, 255, 255, .28); --gl-shine: rgba(255, 255, 255, .3); --gl-shadow: 0 30px 70px -30px rgba(0, 0, 0, .6); --gl-btn: rgba(255, 255, 255, .13); --gl-btn-edge: rgba(255, 255, 255, .26); --gl-track: rgba(255, 255, 255, .2); }
html.study-on[data-theme=light] { --gl-bg: #eef0f8; --gl-card-a: rgba(255, 255, 255, .72); --gl-card-b: rgba(255, 255, 255, .42); --gl-edge: rgba(255, 255, 255, .8); --gl-shine: #fff; --gl-shadow: 0 30px 70px -30px rgba(20, 20, 60, .35); --gl-btn: rgba(255, 255, 255, .55); --gl-btn-edge: rgba(255, 255, 255, .85); --gl-track: rgba(20, 20, 60, .12); }
html.study-on body { background: var(--gl-bg); }
html.study-on body::before { display: none; }
html.study-on .bg-blobs { display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
html.study-on .bg-blobs i { --gl-size: 147vmin; position: absolute; width: var(--gl-size); height: var(--gl-size); margin: calc(var(--gl-size) / -2) 0 0 calc(var(--gl-size) / -2); opacity: .36; will-change: transform; animation: glassDrift 22s ease-in-out infinite alternate; background: radial-gradient(closest-side, var(--gl-c) 0%, color-mix(in srgb, var(--gl-c) 78%, transparent) 28%, color-mix(in srgb, var(--gl-c) 42%, transparent) 55%, color-mix(in srgb, var(--gl-c) 12%, transparent) 80%, transparent 100%); }
html.study-on .bg-blobs i:nth-child(1) { --gl-c: color-mix(in srgb, var(--accent) 72%, #808080); left: 27vw; top: 18vh; }
html.study-on .bg-blobs i:nth-child(2) { --gl-c: color-mix(in srgb, color-mix(in srgb, var(--accent) 45%, #19d3e8) 72%, #808080); left: 75vw; top: 3vh; animation-duration: 28s; animation-delay: -8s; }
html.study-on .bg-blobs i:nth-child(3) { --gl-c: color-mix(in srgb, color-mix(in srgb, var(--accent) 45%, #ff5ca8) 72%, #808080); left: 58vw; top: 100vh; animation-duration: 34s; animation-delay: -14s; }
@media (max-width: 600px) { html.study-on .bg-blobs i { opacity: .2; } }
@media (min-width: 601px) {
  html.study-on .bg-blobs i { --gl-size: 92vmax; opacity: .58; }
  html.study-on .bg-blobs i:nth-child(1) { top: 57vh; }
  html.study-on .bg-blobs i:nth-child(2) { top: 42vh; }
  html.study-on .bg-blobs i:nth-child(3) { left: 57vw; top: 61vh; }
}
@keyframes glassDrift { to { transform: translate(14%, -12%) scale(1.2); } }
html.minimal.study-on .bg-blobs { display: none; }
html.study-on .study { position: relative; z-index: 1; }
html.study-on .face { background: linear-gradient(160deg, var(--gl-card-a), var(--gl-card-b)); border: 1px solid var(--gl-edge); border-radius: 34px; box-shadow: var(--gl-shadow), inset 0 1px 0 var(--gl-shine); -webkit-backdrop-filter: blur(70px) saturate(1.05); backdrop-filter: blur(70px) saturate(1.05); padding: 28px 30px; }
html.study-on .face::before { display: none; }
html.study-on .face-label { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; color: var(--text); opacity: .72; }
html.study-on .face-body { gap: 10px; padding-block: 8px 0; }
html.study-on .face-text { font-weight: 600; font-size: clamp(42px, 7vw, 68px); letter-spacing: -.035em; line-height: 1.1; }
html.study-on .face-text.mid { font-size: clamp(30px, 4.2vw, 48px); line-height: 1.08; }
html.study-on .face-text.long { font-family: var(--display); font-size: clamp(21px, 3vw, 28px); font-weight: 600; letter-spacing: -.015em; line-height: 1.3; text-align: center; }
html.study-on .face:has(.choices) .face-text, html.study-on .face:has(.face-img) .face-text { font-size: clamp(25px, 3.2vw, 36px); line-height: 1.12; }
html.study-on .face .q-small { color: var(--text); opacity: .75; font-size: 18px; }
html.study-on .face-img { max-height: min(200px, 24svh); }
html.study-on .tap-hint { color: var(--text); opacity: .55; }
html.study-on .pts-lbl, html.study-on .keys, html.study-on .grade-hint, html.study-on .sbar-top, html.study-on .sbar-skip, html.study-on .typed-was { color: var(--text); opacity: .8; }
html.study-on .qcounts span[style] { color: var(--text) !important; opacity: .8; }
html.study-on .progress, html.study-on .sbar-track { background: var(--gl-track); }
html.study-on .progress i, html.study-on .sbar-track i { background: var(--text); }
html.study-on .pts .dots i { background: var(--gl-track); box-shadow: none; }
html.study-on .pts .dots i.on { background: var(--text); }
html.study-on .show-btn, html.study-on .grade, html.study-on .choice, html.study-on .answer-in .input, html.study-on .audio-btn { background: var(--gl-btn); color: var(--text); border: 1px solid var(--gl-btn-edge); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gl-shine) 60%, transparent); }
html.study-on .show-btn { border-radius: 99px; }
html.study-on .grade { border-radius: 99px; min-height: 56px; }
html.study-on .grade:hover, html.study-on .choice:hover:not(:disabled), html.study-on .show-btn:hover { background: color-mix(in srgb, var(--text) 16%, transparent); border-color: var(--gl-btn-edge); }
html.study-on .grade.suggest { border-color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 22%, transparent); }
html.study-on .choices { gap: 8px; }
html.study-on .choice { padding: 10px 14px; }
html.study-on .choice kbd { background: var(--gl-btn); color: var(--text); }
html.study-on .choice.right, html.study-on .tf-btn.right { background: color-mix(in srgb, var(--good) 55%, transparent); color: #fff; }
html.study-on .choice.wrong, html.study-on .tf-btn.wrong { background: color-mix(in srgb, var(--again) 55%, transparent); color: #fff; }
html.study-on .answer-in .input { border-radius: 99px; }
html.study-on .done-stats > * { background: var(--gl-btn); border-color: var(--gl-btn-edge); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gl-shine) 60%, transparent); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
html.study-on .answer-in .input::placeholder { color: var(--text); opacity: .55; }
html.study-on .swipe-hint { background: var(--gl-bg); }
html.study-on .swipe-hint.neutral { color: var(--text); }
/* Each label sits on the edge that trails behind the moving card, so it stays on screen. */
.swipe-hint.l { left: auto; right: 22px; transform: rotate(10deg); }
.swipe-hint.r { right: auto; left: 22px; transform: rotate(-10deg); }
.brand { white-space: nowrap; }
@media (max-width: 600px) { .topbar .sync { display: none; } }
/* Phones: the quote gets its own line under the title, in full */
@media (max-width: 600px) {
  .topbar .wrap { flex-wrap: wrap; height: auto; row-gap: 0; padding-top: 8px; padding-bottom: 9px; }
  .topbar .spacer { flex: 1 1 0; }
  .tb-quote { order: 9; flex: 0 0 100%; margin: 0; padding-left: 38px; font-size: 12.5px; line-height: 1.3; }
  .tb-quote span { white-space: normal; overflow: visible; text-overflow: clip; }
}
@media (max-width: 370px) {
  .topbar .wrap { column-gap: 0; }
  .brand { font-size: 15px; gap: 7px; }
  .topbar .icon-btn { width: 34px; }
  .tb-quote { padding-left: 35px; }
}
.flip, .flip * { touch-action: none; }
.deck-bar { position: absolute; left: 20px; right: 66px; bottom: 30px; }
.deck.solid { padding-bottom: 46px; }
@media (min-width: 601px) and (max-width: 1120px) { .home { padding-left: 20px; padding-right: 20px; } }
.pts { flex-direction: column; gap: 4px; }
/* result: spinning border, then a plain coloured edge */
@property --fx-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.fx-ring { --fx: #1fb866; position: absolute; inset: -2px; z-index: 4; pointer-events: none; border-radius: 36px; filter: drop-shadow(0 0 12px var(--fx)); }
.fx-ring.bad { --fx: #ef3f4e; }
.fx-ring.close { --fx: #f0a020; }
.fx-ring::before, .fx-ring b { content: ''; display: block; position: absolute; inset: 0; border-radius: inherit; padding: 4px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.fx-ring::before { background: var(--fx); opacity: 0; animation: fxSettle .4s .85s ease-out forwards; }
.fx-ring b { background: conic-gradient(from var(--fx-a), var(--fx) 0deg, transparent 110deg, var(--fx) 180deg, transparent 290deg, var(--fx) 360deg); animation: fxSpin 1.2s cubic-bezier(.3, .1, .3, 1) forwards; }
@keyframes fxSpin { from { --fx-a: 0deg; } 80% { opacity: 1; } to { --fx-a: 720deg; opacity: 0; } }
@keyframes fxSettle { to { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { .fx-ring b { display: none; } .fx-ring::before { animation-delay: 0s; } }
.result { display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px 9px 16px; border-radius: 99px; color: #fff; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; animation: resultIn .35s var(--ease) both; }
.result svg { width: 22px; height: 22px; flex: none; stroke-width: 3; }
.result.good { background: #0e8a4a; }
.result.bad { background: #cf2f3f; }
.result.close { background: #b5740a; }
@keyframes resultIn { from { transform: scale(.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .result { animation: none; } }
.tf-ans { display: block; font-size: 24px; font-weight: 500; letter-spacing: -.01em; margin: 2px 0; }
.tf-ans b { display: inline; width: auto; height: auto; font-size: inherit; font-weight: 800; border-radius: 0; background: none; color: inherit; }
.pts-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.pts-next { opacity: .55; }
.pts-row.levelup .fbadge { transition: opacity .3s, transform .3s var(--ease); }
.pts-row.levelup .fbadge:not(.pts-next) { opacity: .4; transform: scale(.85); }
.pts-row.levelup .pts-next { opacity: 1; animation: fxFaceUp .6s .1s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes fxFaceUp { from { transform: scale(.8); opacity: .55; } 55% { transform: scale(1.5); box-shadow: 0 0 22px var(--lc); } to { transform: scale(1.22); box-shadow: 0 0 12px var(--lc); opacity: 1; } }
.pts-lbl.levelup { color: #f5b83d !important; opacity: 1 !important; font-weight: 700; animation: resultIn .3s var(--ease) both; }
@media (prefers-reduced-motion: reduce) { .pts-row.levelup .pts-next, .pts-lbl.levelup { animation: none; } }
.fi-demo { margin: 0 0 18px; }
.modal .sx-pop { position: static; width: auto; opacity: 1; transform: none; pointer-events: auto; box-shadow: none; }
.modal .sx-title { display: none; }
.pts .dots.bar { display: block; width: 130px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--gl-track, var(--surface-3)); }
.pts .dots.bar i { display: block; height: 100%; border-radius: inherit; box-shadow: none; transition: width .25s var(--ease); }
.flip.fx-done .face-body { opacity: .22; transition: opacity .2s; }
.pts-end { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; }
.pts-end svg { width: 17px; height: 17px; stroke-width: 3; }
.pts-end.bad { background: #cf2f3f; }
.pts-end.good { background: #0e8a4a; }
.pts-end.good.earned { animation: fxEarned .5s var(--ease); }
@keyframes fxEarned { 40% { transform: scale(1.35); box-shadow: 0 0 18px #1fb866; } }
/* card finished */
.fx-ring.gold { --fx: #f5b83d; }
.fx-ring.gold b { animation-duration: .8s; }
.fx-ring.gold::before { animation-delay: .45s; }
.flip.fx-done { animation: fxPop .5s var(--ease) !important; }
@keyframes fxPop { 35% { transform: scale(1.035); } }
.fx-stamp { position: absolute; left: 50%; top: 50%; z-index: 6; display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px 12px 18px; border-radius: 99px; background: #f5b83d; color: #1a1305; font-family: var(--display); font-size: 22px; font-weight: 700; white-space: nowrap; box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .6); transform: translate(-50%, -50%); animation: fxStamp .4s cubic-bezier(.2, 1.5, .4, 1) both; pointer-events: none; }
.fx-stamp svg { width: 22px; height: 22px; stroke-width: 3; flex: none; }

<script>
/* Spaced repetition (SM-2 style with learning steps). Pure: no DOM, no Apps Script.
   A progress state looks like:
   { s: 'new'|'learn'|'review', due: ms, ivl: days, ease: 2.5, step: 0, reps: 0, lapses: 0 }
   NOTE: client code must never contain a double slash (HtmlService strips it). */
var SRS = (function () {
  var MIN = 60 * 1000;
  var DAY = 24 * 60 * MIN;
  var SRS_DAY_ = DAY;
  var LEARN_STEPS = [1 * MIN, 10 * MIN];
  var RELEARN_STEP = 10 * MIN;
  var START_EASE = 2.5;
  var MIN_EASE = 1.3;
  var GRADES = ['again', 'hard', 'good', 'easy'];

  function fresh() {
    return { s: 'new', due: 0, ivl: 0, ease: START_EASE, step: 0, reps: 0, lapses: 0, first: 0, g: '', rest: 0, pt: 0, pd: 0, dw: [], st: 1, iv: 0, dd: 0 };
  }

  function normalize(p) {
    var f = fresh();
    if (!p || typeof p !== 'object') return f;
    return {
      s: p.s === 'learn' || p.s === 'review' ? p.s : 'new',
      due: Number(p.due) || 0,
      ivl: Math.max(0, Number(p.ivl) || 0),
      ease: Math.max(MIN_EASE, Number(p.ease) || START_EASE),
      step: Math.max(0, Math.floor(Number(p.step) || 0)),
      reps: Math.max(0, Math.floor(Number(p.reps) || 0)),
      lapses: Math.max(0, Math.floor(Number(p.lapses) || 0)),
      first: Math.max(0, Number(p.first) || 0),
      g: GRADES.indexOf(p.g) >= 0 ? p.g : '',
      rest: Math.max(0, Number(p.rest) || 0),
      pt: Math.max(0, Math.floor(Number(p.pt) || 0)),
      pd: Math.max(0, Number(p.pd) || 0),
      dw: Array.isArray(p.dw) ? p.dw.map(Number).filter(function (x) { return x > 0; }).slice(-10) : [],
      st: stageOf_(p),
      iv: Math.max(0, Math.min(365, Math.floor(Number(p.iv) || 0))),
      dd: Math.max(0, Number(p.dd) || 0)
    };

  /* Small deterministic-ish fuzz so cards learned together don't all land on the same day. */
  function fuzz(days, rnd) {
    if (days < 3) return days;
    var spread = Math.max(1, Math.round(days * 0.05));
    var r = typeof rnd === 'number' ? rnd : Math.random();
    return days + Math.round((r * 2 - 1) * spread);

  /* Start of the next study day: days roll over at 4am local time. */
  function dayStart(now, offsetDays) {
    var d = new Date(now);
    if (d.getHours() < 4) d.setDate(d.getDate() - 1);
    d.setHours(4, 0, 0, 0);
    d.setDate(d.getDate() + (offsetDays || 0));
    return d.getTime();
  }

  function graduate(p, days, now, rnd) {
    var ivl = Math.max(1, fuzz(days, rnd));
    p.s = 'review';
    p.ivl = ivl;
    p.step = 0;
    p.due = dayStart(now, ivl);
    return p;
  }

  /* Returns a NEW progress object after answering with grade (again|hard|good|easy). */
  function grade(prev, g, now, rnd) {
    if (GRADES.indexOf(g) < 0) throw new Error('Bad grade: ' + g);
    now = now || Date.now();
    var p = normalize(prev);
    if (!p.first) p.first = now;
    p.g = g;
    p.reps += 1;

    if (p.s === 'new' || p.s === 'learn') {
      var relearning = p.ivl > 0;
      p.s = 'learn';
      if (g === 'again') { p.step = 0; p.due = now + (relearning ? RELEARN_STEP : LEARN_STEPS[0]); return p; }
      if (g === 'hard') {
        p.due = now + (relearning ? RELEARN_STEP : Math.round((LEARN_STEPS[0] + LEARN_STEPS[1]) / 2));
        return p;
      }
      if (g === 'easy') return graduate(p, relearning ? Math.max(1, p.ivl) + 1 : 4, now, rnd);
      /* good */
      if (relearning) return graduate(p, Math.max(1, p.ivl), now, rnd);
      p.step += 1;
      if (p.step >= LEARN_STEPS.length) return graduate(p, 1, now, rnd);
      p.due = now + LEARN_STEPS[p.step];
      return p;
    }

    /* review */
    var late = Math.max(0, (now - p.due) / DAY);
    if (g === 'again') {
      p.lapses += 1;
      p.ease = Math.max(MIN_EASE, p.ease - 0.2);
      p.ivl = Math.max(1, Math.round(p.ivl * 0.5));
      p.s = 'learn';
      p.step = 0;
      p.due = now + RELEARN_STEP;
      return p;
    }

    if (g === 'hard') {
      p.ease = Math.max(MIN_EASE, p.ease - 0.15);

      next = Math.max(p.ivl + 2, Math.round((p.ivl + late) * p.ease * 1.3));

  /* Human label for when a grade would next show the card, e.g. "10m", "3d". */
  function preview(prev, g, now) {

    p = normalize(p);

  }

  /* Map the old app's score (1 best .. 4 worst) and times seen to a progress state. */
  function fromLegacy(score, times, now, idx) {

    return p;
  }

  /* ---------- stage ladder (Free study and Focus) ----------
     Each time a card is due, `goal` right answers in a row move it up one stage and send it away:
     stage 1 -> back tomorrow, 2 -> 3 days, 3 -> a week, 4 -> 2 weeks, then 4, 8 ... (iv doubles, max 180).
     A wrong answer resets the count and drops one stage (at most once a day). rest = away until. */
  var GAPS = { 1: 1, 2: 3, 3: 7 };
  /* Older progress (before stages) maps to a starting stage once. */
  function stageOf_(p) {
    var n = Math.floor(Number(p.st));
    if (n >= 1 && n <= 4) return n;
    var now = Date.now();
    if (Number(p.rest) > now) return 4;
    var today = dayStart(now, 0);
    var days = Array.isArray(p.dw) ? p.dw.filter(function (d) { d = Number(d); return d <= today && d > today - 7 * DAY; }).length : 0;
    return days >= 3 ? 3 : days >= 1 ? 2 : 1;

  function pointsToday(p, now) { return p.pd === dayStart(now, 0) ? p.pt : 0; }
  function isAway(prev, now) { return normalize(prev).rest > now; }
  function gapDays(p) { return p.st >= 4 ? (p.iv || 14) : GAPS[p.st]; }
  /* right: true, false, or null (a guess: no change). Returns {p, done, from, to, back}. */
  function answer(prev, right, now, goal) {
    var p = normalize(prev), today = dayStart(now, 0);
    goal = Math.max(1, goal || 5);
    if (p.pd !== today) { p.pt = 0; p.pd = today; }
    if (!p.first) p.first = now;
    var from = p.st, done = false;
    if (right === false) {
      p.pt = 0; p.g = 'again';
      if (p.st > 1 && p.dd !== today) { p.st--; p.dd = today; }
    } else if (right === true) {
      p.pt += 1; p.g = 'good';
      if (p.pt >= goal) {
        done = true;
        var gap = gapDays(p);
        p.rest = dayStart(now, gap);
        if (p.st >= 4) p.iv = Math.min(180, gap * 2); else { p.st++; if (p.st === 4) p.iv = 14; }
        p.pt = 0;
      }

    return { p: p, done: done, from: from, to: p.st, back: done ? p.rest : 0 };
  }
  /* For hints: what a right answer that completes the run would do. */
  function nextGap(prev) { return gapDays(normalize(prev)); }
  /* Faces: level 4 (stage 1, cold) .. level 1 (stage 4, star-struck). */
  function level(prev) { return 5 - normalize(prev).st; }
  function isNew(prev) { var p = normalize(prev); return !p.g && p.st === 1 && !p.rest; }

    level: level, answer: answer, doneToday: doneToday, isAway: isAway, nextGap: nextGap, pointsToday: pointsToday, isNew: isNew, fresh: fresh, normalize: normalize, grade: grade, preview: preview, isDue: isDue,
    dayStart: dayStart, fromLegacy: fromLegacy, GRADES: GRADES, DAY: DAY, MIN: MIN
  };
})();

/* Text helpers shared by client and server. Pure. No double slashes allowed in this file. */
var TextUtil = (function () {
  function fold(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[\u2018\u2019\u201c\u201d"'`.,!?;:()\[\]{}\-_]/g, ' ')
      .replace(/\s+/g, ' ')

  }

    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    var prev = [], cur = [], i, j;

    for (i = 1; i <= a.length; i++) {
      cur = [i];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

      prev = cur;

     Returns 'exact' | 'close' | 'wrong'. Several accepted answers can be separated by " / " or " | ". */
  function check(typed, expected) {

    var options = String(expected == null ? '' : expected).split(/\s[\/|]\s|\n/).map(fold).filter(Boolean);

      var allowed = o.length <= 3 ? 0 : o.length <= 8 ? 1 : Math.floor(o.length / 6);
      if (lev(t, o) <= allowed) best = 'close';

  }

  function parsePairs(text) {
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');

    var sample = lines.filter(function (l) { return l.trim(); }).slice(0, 10);

  function statusTag(c) {
    var now = Date.now(), best = null;
    dirsOf(c).forEach(function (d) { var p = prog(c, d); if (!best || (p.s !== 'new' && (best.s === 'new' || p.due < best.due))) best = p; });
    if (best.s === 'new') return '<span class="tag" style="color:var(--easy)">New</span>';
    if (best.s === 'learn') return '<span class="tag" style="color:var(--again)">Learning</span>';
    if (best.due <= now) return '<span class="tag" style="color:var(--good)">Due</span>';
    var days = Math.max(1, Math.round((best.due - now) / SRS.DAY));
    return '<span class="tag">' + (days >= 60 ? Math.round(days / 30) + 'mo' : days + 'd') + '</span>';
  }

  /* Reset progress, with a typed RESET so it can't happen by accident. */

        '<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" style="background:var(--again)" data-ok disabled>' + esc(okLabel) + '</button>');

      inp.addEventListener('input', function () { ok.disabled = inp.value.trim().toUpperCase() !== 'RESET'; });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !ok.disabled) ok.click(); });
