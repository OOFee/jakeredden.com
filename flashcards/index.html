  /* ================= study ================= */
  function startMission(deckIds, from) {
    var now = Date.now(), start = SRS.dayStart(now, 0);
    var learn = [], review = [], fresh = [];
    deckIds.forEach(function (id) {
      var newDone = 0, newPool = [];
      cardsOf(id).forEach(function (c) {
        dirsOf(c).forEach(function (d) {
          var p = prog(c, d);
          if (p.first >= start) newDone++;
          var item = { card: c, dir: d };
          if (p.s === 'new') newPool.push(item);
          else if (p.s === 'learn') learn.push(item);
          else if (p.due <= now) review.push(item);
        });
      });
      var left = Math.max(0, newLimit() - newDone);
      fresh = fresh.concat(newPool.slice(0, left));
    });
    if (!learn.length && !review.length && !fresh.length) {
      var nd = nextDue(deckIds);
      toast(cardsOf(deckIds[0] || '').length || deckIds.length > 1 ? 'Mission complete for today.' + (nd ? ' Next cards are due ' + whenLabel(nd) + '.' : '') : 'Add some cards first.');
      return;
    }
    var deck = deckIds.length === 1 ? deckById(deckIds[0]) : null;
    S.study = {
      learn: learn, review: shuffle(review), fresh: fresh, later: [], n: 0, correct: 0, started: now, from: from,
      color: deck ? deck.color : DEFAULT_ACCENT, title: deck ? deck.name : 'All decks', total: learn.length + review.length + fresh.length, cur: null
    };
    if (deck) S.deckId = deck.id;
    nextItem();
    go('study');
  }
  /* Free study and Focus: the stage ladder (see SRS.answer). Wrong = count back to 0, returns in 2 or 3 cards;
     right = +1, returns later; at the deck's goal it moves up a stage and goes away. Mission is not touched. */
  function startFree(deckIds, from, lvl, andWorse, all) {
    var now = Date.now(), items = [], resting = [];
    deckIds.forEach(function (id) {
      var goal = deckGoal(id);
      cardsOf(id).forEach(function (c) {
        dirsOf(c).forEach(function (d) {
          var p = prog(c, d), l = SRS.level(p);
          if (lvl && !(l === lvl || (andWorse && l > lvl))) return;
          var skip = !lvl && !all && p.rest > now;
          (skip ? resting : items).push({ card: c, dir: d });
        });
      });
    });
    if (!items.length && resting.length) {
      items = resting;
      items.forEach(function (it) { it.again = true; });
      toast('Nothing due here, so this is an early round.');
    }
    if (!items.length) { toast(lvl ? 'No cards at that level right now.' : 'Add some cards first.'); return; }
    var deck = deckIds.length === 1 ? deckById(deckIds[0]) : null;
    S.study = {
      free: true, simple: !!all, done: 0, skipped: 0, firstTry: 0, label: all ? 'Free study' : 'Focus', learn: [], review: shuffle(items), later: [], fresh: [], n: 0, correct: 0, rested: 0, doneToday: 0, started: now, from: from,
      color: deck ? deck.color : DEFAULT_ACCENT, title: deck ? deck.name : 'All decks', total: items.length, cur: null
    };
    if (deck) S.deckId = deck.id;
    nextItem();
    go('study');
  }
  function nextItem() {
    var s = S.study, now = Date.now();
    if (s.free && !s.review.length && s.later.length) { s.review = shuffle(s.later); s.later = []; }
    s.learn.sort(function (a, b) { return prog(a.card, a.dir).due - prog(b.card, b.dir).due; });
    var item = null;
    if (s.learn.length && prog(s.learn[0].card, s.learn[0].dir).due <= now) item = s.learn.shift();
    else if (s.review.length && s.fresh.length) item = (s.n % 4 === 3 ? s.fresh : s.review).shift();
    else if (s.review.length) item = s.review.shift();
    else if (s.fresh.length) item = s.fresh.shift();
    else if (s.learn.length && prog(s.learn[0].card, s.learn[0].dir).due <= now + 20 * SRS.MIN) item = s.learn.shift();
    if (item && !cardById(item.card.id)) return nextItem();
    s.cur = item ? { item: item, revealed: false, verdict: null, typed: '', picked: null, options: null } : null;
    if (item && item.card.type === 'choice') s.cur.options = choiceOptions(item);
    if (s.cur) preload();
  }
  function preload() {
    var s = S.study, list = [s.cur.item].concat(s.learn.slice(0, 2), s.review.slice(0, 2), s.fresh.slice(0, 2));
    list.forEach(function (it) {
      [it.card.frontMedia, it.card.backMedia].forEach(function (m) { if (m && m.img) mediaUrl(m.img); if (m && m.audio) mediaUrl(m.audio); });
    });
  }
  function qa(item) {
    var c = item.card, f = item.dir === 'f';
    return { q: f ? c.front : c.back, a: f ? c.back : c.front, qm: (f ? c.frontMedia : c.backMedia) || {}, am: (f ? c.backMedia : c.frontMedia) || {} };
  }
  function choiceOptions(item) {
    var x = qa(item), right = x.a;
    var seen = {}; seen[TextUtil.fold(right)] = 1;
    var pool = shuffle(cardsOf(item.card.deckId).filter(function (c) { return c.id !== item.card.id; }).map(function (c) { return item.dir === 'f' ? c.back : c.front; }))
      .filter(function (t) { var k = TextUtil.fold(t); if (!k || seen[k]) return false; seen[k] = 1; return true; }).slice(0, 3);
    if (pool.length < 1) return null;
    return shuffle(pool.concat([right])).map(function (t) { return { text: t, right: t === right }; });
  }
  function remaining() {
    var s = S.study;
    return { n: s.fresh.length, l: s.learn.length, r: s.review.length + (s.later ? s.later.length : 0) };
  }
  function mediaHtml(m) {
    return (m.img ? '<img class="face-img" data-media="' + esc(m.img) + '" alt="">' : '') +
      (m.audio ? '<button class="audio-btn" data-audio="' + esc(m.audio) + '" aria-label="Play audio">' + I.audio + '</button>' : '');
  }
  function textHtml(t) {
    if (!t) return '';
    return '<div class="face-text' + (t.length > 60 ? ' long' : t.length > 18 ? ' mid' : '') + '">' + esc(t) + '</div>';
  }

  function renderStudy(app) {
    var s = S.study;
    if (!s) { go('home'); return; }
    if (!s.cur) return renderDone(app);
    var rem = remaining(), done = s.n, total = done + rem.n + rem.l + rem.r + 1;
    var item = s.cur.item, x = qa(item), c = item.card, p = prog(c, item.dir);
    var kind = cardKind(c, s);
    var curKey = p.s === 'new' ? 'n' : p.s === 'learn' ? 'l' : 'r';
    var label = (item.dir === 'r' ? 'Reverse' : 'Front') + (S.decks.length > 1 && s.title === 'All decks' ? ' &middot; ' + esc((deckById(c.deckId) || {}).name || '') : '');

    var frontBody = '<div class="face-body">' + mediaHtml(x.qm) + textHtml(x.q);
    if (kind === 'typed') frontBody += '<form class="answer-in" data-typed><input class="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the answer" data-answer></form>';
    if (kind === 'choice') frontBody += '<div class="choices">' + s.cur.options.map(function (o, i) { return '<button class="choice" data-opt="' + i + '"><kbd>' + (i + 1) + '</kbd><span></span></button>'; }).join('') + '</div>';
    frontBody += '</div>' + (kind === 'basic' ? '<div class="tap-hint">Tap to flip</div>' : kind === 'tf' ? '<div class="tap-hint">Drag left for true, right for false</div>' : '');

    app.innerHTML = '<div class="study"><div class="wrap" style="display:flex;flex-direction:column;flex:1">' +
      '<div class="study-top"><button class="btn ghost icon-btn" data-exit aria-label="End session">' + I.x + '</button>' +
      (s.simple ? '<div class="spacer"></div>' : '<div class="progress"><i style="width:' + Math.round(100 * done / total) + '%"></i></div>') +
      (s.free ? '<div class="qcounts"><span style="color:var(--muted)">' + s.label + ' &middot; ' + (rem.r + 1) + ' left</span></div>' : '') +
      (s.free ? '' : '<div class="qcounts"><span class="n' + (curKey === 'n' ? ' cur' : '') + '">' + (rem.n + (curKey === 'n' ? 1 : 0)) + '</span><span class="l' + (curKey === 'l' ? ' cur' : '') + '">' + (rem.l + (curKey === 'l' ? 1 : 0)) + '</span><span class="r' + (curKey === 'r' ? ' cur' : '') + '">' + (rem.r + (curKey === 'r' ? 1 : 0)) + '</span></div>') +
      '<button class="btn ghost icon-btn" data-edit aria-label="Edit card" title="Edit card (E)">' + I.edit + '</button></div>' +
      '<div class="stage">' + pointsRow(c, item.dir, s) + '<div class="flip" data-flip><span class="swipe-hint l' + (kind === 'tf' ? ' neutral">True' : '">Wrong') + '</span><span class="swipe-hint r' + (kind === 'tf' ? ' neutral">False' : '">Right') + '</span><div class="inner">' +
      '<div class="face front"><div class="face-label">' + label + '</div>' + frontBody + '</div>' +
      '<div class="face back"><div class="face-label">Answer</div><div class="face-body" data-back></div></div>' +
      '</div></div><div class="dock" data-dock></div></div></div></div>';
    $$('.choice span', app).forEach(function (sp, i) { sp.textContent = s.cur.options[i].text; });
    hydrate($('.face.front', app));
    if (x.qm.audio && !s.cur.autoplayed) { s.cur.autoplayed = true; playAudio(x.qm.audio); }

    $('[data-exit]', app).addEventListener('click', endStudy);
    $('[data-edit]', app).addEventListener('click', editCurrent);
    var flipEl = $('[data-flip]', app);
    flipEl.style.animation = 'rise .4s var(--ease)';
    if (kind === 'typed') {
      var inp = $('[data-answer]', app);
      setTimeout(function () { inp.focus(); }, 60);
      $('[data-typed]', app).addEventListener('submit', function (e) {
        e.preventDefault();
        s.cur.typed = inp.value;
        s.cur.verdict = TextUtil.check(inp.value, x.a);
        resultRing(s.cur.verdict);
        reveal();
      });
    }
    $$('[data-opt]', app).forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); pick(Number(b.getAttribute('data-opt'))); }); });
    $$('[data-tf]', app).forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); pickTf(b.getAttribute('data-tf') === '1'); }); });
    wireSwipe(flipEl, kind);
    paintDock();
    if (s.cur.revealed) showBack(true);
  }

  /* Colour spins around the card's border, then stays as a plain coloured edge until the next card. */
  function resultRing(v) {
    var flip = $('[data-flip]');
    if (!flip) return;
    var old = $('.fx-ring', flip); if (old) old.remove();
    if (v !== 'close') paintDots(v === 'exact');
    flip.appendChild(el('<i class="fx-ring ' + (v === 'exact' ? 'good' : v === 'close' ? 'close' : 'bad') + '" aria-hidden="true"><b></b></i>'));
  }
  /* The result, in words nobody can misread. */
  function resultBadge(v, text) {
    return '<div class="result ' + (v === 'exact' ? 'good' : v === 'close' ? 'close' : 'bad') + '" role="status">' + (v === 'wrong' ? I.x : I.check) + '<span>' + text + '</span></div>';
  }
  function pick(i) {
    var s = S.study;
    if (!s.cur || s.cur.revealed || !s.cur.options || !s.cur.options[i]) return;
    s.cur.picked = i;
    s.cur.verdict = s.cur.options[i].right ? 'exact' : 'wrong';
    resultRing(s.cur.verdict);
    $$('[data-opt]').forEach(function (b, j) {
      b.disabled = true;
      if (s.cur.options[j].right) b.classList.add('right'); else if (j === i) b.classList.add('wrong');
    });
    setTimeout(reveal, 650);
  }
  function pickTf(said) {
    var s = S.study;
    if (!s.cur || s.cur.revealed || cardKind(s.cur.item.card, s) !== 'tf') return;
    var truth = tfAnswer(s.cur.item.card);
    s.cur.verdict = said === truth ? 'exact' : 'wrong';
    s.cur.said = said;
    resultRing(s.cur.verdict);
    $$('[data-tf]').forEach(function (b) {
      b.disabled = true;
      var isTrue = b.getAttribute('data-tf') === '1';
      if (isTrue === truth) b.classList.add('right'); else if (isTrue === said) b.classList.add('wrong');
    });
    setTimeout(reveal, 600);
  }
  function reveal() {
    var s = S.study;
    if (!s || !s.cur || s.cur.revealed) return;
    s.cur.revealed = true;
    showBack(false);
    paintDock();
  }
  function showBack(instant) {
    var s = S.study, x = qa(s.cur.item), back = $('[data-back]');
    if (!back) return;
    var v = s.cur.verdict, c = s.cur.item.card, html;
    if (cardKind(c, s) === 'tf') {
      var truth = tfAnswer(c), ex = tfExplain(c);
      html = (v ? resultBadge(v, v === 'exact' ? 'Correct' : 'Wrong') : '') + '<div class="q-small"></div>' +
        '<div class="tf-ans">The answer is <b>' + (truth ? 'True' : 'False') + '</b></div>' + (ex ? '<p class="tf-ex"></p>' : '') + mediaHtml(x.am);
      back.innerHTML = html;
      $('.q-small', back).textContent = x.q;
      var exEl = $('.tf-ex', back); if (exEl) exEl.textContent = ex;
      hydrate(back);
      var fl = $('[data-flip]');
      if (instant) { $('.inner', fl).style.transition = 'none'; fl.classList.add('flipped'); fl.offsetWidth; $('.inner', fl).style.transition = ''; }
      else fl.classList.add('flipped');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      return;
    }
    html = (v ? resultBadge(v, v === 'exact' ? 'Correct' : v === 'close' ? 'Almost, check the spelling' : 'Wrong') : '') + '<div class="q-small"></div>' + mediaHtml(x.am) + textHtml(x.a);
    if (s.cur.typed && v !== 'exact') html += '<div class="typed-was">You wrote: <s></s></div>';
    back.innerHTML = html;
    $('.q-small', back).textContent = x.q;
    var was = $('.typed-was s', back); if (was) was.textContent = s.cur.typed;
    hydrate(back);
    var flip = $('[data-flip]');
    if (instant) { $('.inner', flip).style.transition = 'none'; flip.classList.add('flipped'); flip.offsetWidth; $('.inner', flip).style.transition = ''; }
    else flip.classList.add('flipped');
    if (x.am.audio) playAudio(x.am.audio);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  /* Two buttons. A = wrong, B = right. Cards the app can mark itself never ask: multiple choice and true/false
     just move on (answered right outside Free study, they offer Guessed / Knew it). An exact typed answer just moves on;
     other typed answers keep both buttons, because the app can misjudge a typo or another valid wording. */
  function dockChoices(s) {
    var c = s.cur.item.card, kind = cardKind(c, s), v = s.cur.verdict;
    var marked = (kind === 'tf' || kind === 'choice') && !!v;
    if (s.simple && marked) return [{ g: v === 'wrong' ? 'wrong' : 'right', label: 'Next', cls: v === 'wrong' ? 'again' : 'good' }];
    if (kind === 'typed' && v === 'exact') return [{ g: 'right', label: 'Next', cls: 'good' }];
    if (marked) {
      if (v === 'wrong') return [{ g: 'wrong', label: 'Next', cls: 'again', key: 'Enter' }];
      return [{ g: 'guess', label: 'Guessed', cls: 'hard' }, { g: 'right', label: 'Knew it', cls: 'good' }];
    }
    var sug = v === 'exact' || v === 'close' ? 'right' : v === 'wrong' ? 'wrong' : null;
    return [{ g: 'wrong', label: 'Wrong', cls: 'again', sug: sug === 'wrong' }, { g: 'right', label: 'Right', cls: 'good', sug: sug === 'right' }];
  }
  function dockHint(s, g) {
    var item = s.cur.item, p = prog(item.card, item.dir), now = Date.now();
    if (!s.free) return SRS.preview(p, g === 'wrong' ? 'again' : g === 'guess' ? 'hard' : 'good', now);
    if (g === 'wrong') return 'Back to 0' + (p.st > 1 && p.dd !== SRS.dayStart(now, 0) ? ', down a stage' : '');
    if (g === 'guess') return 'No change';
    var goal = deckGoal(item.card.deckId), n = Math.min(goal, SRS.pointsToday(p, now) + 1);
    return n >= goal ? 'Moves up, back ' + gapLabel(SRS.nextGap(p)) : '+1 &middot; ' + n + '/' + goal;
  }
  function paintDock() {
    var s = S.study, dock = $('[data-dock]');
    if (!dock) return;
    var c = s.cur.item.card, kind = cardKind(c, s);
    if (!s.cur.revealed) {
      dock.innerHTML = kind === 'basic' ? '<button class="btn primary show-btn" data-show>Flip</button><div class="keys"><kbd>Space</kbd> flip</div>'
        : kind === 'typed' ? '<button class="btn primary show-btn" data-check>Check</button><div class="keys"><kbd>Enter</kbd> check &middot; <kbd>Esc</kbd> end</div>'
        : kind === 'tf' ? '<div class="grades two tf-dock"><div class="grade-wrap"><button class="grade tf-btn t" data-tf="1"><b>O</b>True</button></div><div class="grade-wrap"><button class="grade tf-btn f" data-tf="0"><b>X</b>False</button></div></div><div class="keys"><kbd>O</kbd> or <kbd>&larr;</kbd> true &middot; <kbd>X</kbd> or <kbd>&rarr;</kbd> false</div>'
        : '<div class="keys"><kbd>1</kbd>-<kbd>4</kbd> pick an answer</div>';
      dock.insertAdjacentHTML('beforeend', dockFoot(s));
      var sk0 = $('[data-skip]', dock); if (sk0) sk0.addEventListener('click', skipCard);
      var sb = $('[data-show]', dock); if (sb) sb.addEventListener('click', reveal);
      $$('[data-tf]', dock).forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); pickTf(b.getAttribute('data-tf') === '1'); }); });
      var cb = $('[data-check]', dock); if (cb) cb.addEventListener('click', function () { $('[data-typed]').requestSubmit(); });
      return;
    }
    var ch = dockChoices(s);
    dock.innerHTML = '<div class="grades two' + (ch.length === 1 ? ' one' : '') + '">' + ch.map(function (o) {
      return '<div class="grade-wrap"><button class="grade ' + o.cls + (o.sug ? ' suggest' : '') + '" data-g="' + o.g + '">' + o.label + '</button>' + (s.simple ? '' : '<span class="grade-hint">' + dockHint(s, o.g) + '</span>') + '</div>';
    }).join('') + '</div>' + dockFoot(s) + '<div class="keys">' + (ch.length === 1 ? '<kbd>Enter</kbd> next' : '<kbd>1</kbd> or <kbd>&larr;</kbd> ' + ch[0].label.toLowerCase() + ' &middot; <kbd>2</kbd> or <kbd>&rarr;</kbd> ' + ch[1].label.toLowerCase()) + ' &middot; <kbd>Space</kbd> flip back</div>';
    $$('[data-g]', dock).forEach(function (b) { b.addEventListener('click', function () { grade(b.getAttribute('data-g')); }); });
    var sk = $('[data-skip]', dock); if (sk) sk.addEventListener('click', skipCard);
  }
  /* Under the buttons: Free study gets a progress bar; every mode gets Skip (no change to progress, back next session). */
  function dockFoot(s) {
    if (s.simple) return simpleBar(s, true);
    return '<div class="sbar"><div class="sbar-top"><span></span><button class="sbar-skip" data-skip title="Skip for now, it comes back next session (S)">Skip ' + I.back.replace('m15 18-6-6 6-6', 'm9 18 6-6-6-6') + '</button></div></div>';
  }
  /* Free study progress bar along the bottom, with Skip. */
  function simpleBar(s, withSkip) {
    var gone = s.done + s.skipped, pct = s.total ? Math.round(100 * gone / s.total) : 0;
    return '<div class="sbar"><div class="sbar-top"><span>' + gone + ' of ' + s.total + ' done</span>' + (withSkip ? '<button class="sbar-skip" data-skip title="Skip this card (S)">Skip ' + I.back.replace('m15 18-6-6 6-6', 'm9 18 6-6-6-6') + '</button>' : '') + '</div><div class="sbar-track"><i style="width:' + pct + '%"></i></div></div>';
  }
  function skipCard() {
    var s = S.study;
    if (!s || !s.cur || s.grading) return;
    s.grading = true; s.skipped = (s.skipped || 0) + 1;
    animateOut('hard', 0);
  }
  function grade(g, dirOut) {
    var s = S.study;
    if (!s || !s.cur || !s.cur.revealed || s.grading) return;
    var allowed = dockChoices(s).map(function (o) { return o.g; });
    if (allowed.indexOf(g) < 0) return;
    s.grading = true;
    var item = s.cur.item, c = item.card, now = Date.now();
    var right = g === 'right' ? true : g === 'wrong' ? false : null;
    if (!s.cur.verdict && right !== null) resultRing(right ? 'exact' : 'wrong');
    c.srs = c.srs || {};
    if (s.simple) {
      s.n++;
      bumpDaily(!!right);
      if (right !== false) s.correct++;
      item.run = right === false ? 0 : (item.run || 0) + 1;
      if (right === false) item.missed = true;
      var finished = item.run >= deckGoal(c.deckId);
      if (finished) { s.done++; if (!item.missed) s.firstTry++; }
      else {
        var lo2 = Math.min(s.review.length, 3);
        s.review.splice(lo2 + Math.floor(Math.random() * (s.review.length - lo2 + 1)), 0, item);
      }
      return animateOut(right === false ? 'again' : 'good', dirOut, finished ? 'Done' : '');
    }
    if (s.free) {
      var r = SRS.answer(prog(c, item.dir), right, now, deckGoal(c.deckId));
      c.srs[item.dir] = r.p;
      queueReview(c.id, item.dir, r.p);
      s.n++;
      if (right) s.correct++;
      bumpDaily(!!right);
      if (right === false) s.review.splice(Math.min(s.review.length, 1 + Math.floor(Math.random() * 2)), 0, item);
      else if (right === null) s.later.push(item);
      else if (!r.done) {
        var lo = Math.min(s.review.length, 3);
        s.review.splice(lo + Math.floor(Math.random() * (s.review.length - lo + 1)), 0, item);
      } else { s.doneToday++; s.levelUp = FACE_NAMES[5 - r.to] + ', back ' + gapLabel(Math.round((r.back - SRS.dayStart(now, 0)) / SRS.DAY)); }
      return animateOut(right === false ? 'again' : right === null ? 'hard' : 'good', dirOut, r.done ? 'Done for today' : '');
    }
    var mg = right === false ? 'again' : right === null ? 'hard' : 'good';
    var after = SRS.grade(prog(c, item.dir), mg, now);
    c.srs[item.dir] = after;
    queueReview(c.id, item.dir, after);
    bumpDaily(!!right);
    s.n++; if (right) s.correct++;
    if (after.s === 'learn') s.learn.push(item);
    animateOut(mg, dirOut, right === true && after.s === 'review' ? 'Done for today' : '', 340);
  }
  /* The emoji row shows a card moving up: dots fill, the next face pops, the label says where it went and when it is back. */
  function tickUpRow(text) {
    var row = $('.pts .pts-row'), lbl = $('.pts .pts-lbl');
    if (!row) return;
    var box = $('.dots', row);
    if (box) {
      box.setAttribute('data-n', box.getAttribute('data-goal'));
      if (box.classList.contains('bar')) box.firstChild.style.width = '100%';
      else $$('i', box).forEach(function (d) { d.classList.add('on'); });
    }
    row.classList.add('levelup');
    if (lbl) { lbl.removeAttribute('data-of'); lbl.textContent = text; lbl.classList.add('levelup'); }
  }
  /* The card is finished: gold border, a small pop, sparks and a stamp, before it leaves. */
  function celebrate(flip, label) {
    flip.style.transition = ''; flip.style.transform = '';
    $$('.swipe-hint', flip).forEach(function (h) { h.style.opacity = 0; });
    var old = $('.fx-ring', flip); if (old) old.remove();
    flip.appendChild(el('<i class="fx-ring gold" aria-hidden="true"><b></b></i>'));
    flip.classList.add('fx-done');
    var stamp = el('<div class="fx-stamp" role="status">' + I.check + '<span></span></div>');
    $('span', stamp).textContent = label;
    flip.appendChild(stamp);
    var burst = el('<div class="fx-burst" aria-hidden="true"></div>'), colours = ['#f5b83d', '#ffe08a', '#1fb866', '#ffffff'];
    for (var i = 0; i < 18; i++) {
      var a = (i / 18) * Math.PI * 2 + Math.random() * 0.3, far = 110 + Math.random() * 90;
      burst.appendChild(el('<i style="--x:' + Math.round(Math.cos(a) * far) + 'px;--y:' + Math.round(Math.sin(a) * far) + 'px;--s:' + (0.6 + Math.random() * 0.8).toFixed(2) + ';--d:' + Math.round(Math.random() * 90) + 'ms;background:' + colours[i % colours.length] + '"></i>'));
    }
    flip.appendChild(burst);
  }
  function animateOut(g, dirOut, finished, hold) {
    var s = S.study;
    var flip = $('[data-flip]');
    if (flip && finished) {
      celebrate(flip, finished);
      if (s.levelUp) { tickUpRow(s.levelUp); s.levelUp = null; hold = 1000; }
      setTimeout(function () {
        flip.style.transition = 'transform .24s var(--ease), opacity .24s';
        flip.style.transform = 'translateY(-26px) scale(.97)';
        flip.style.opacity = '0';
      }, hold || 640);
      setTimeout(function () {
        s.grading = false;
        nextItem();
        if (S.view === 'study') render();
      }, (hold || 640) + 220);
      return;
    }
    var dx = dirOut != null ? dirOut : g === 'again' ? -1 : g === 'hard' ? 0 : 1;
    if (flip) {
      flip.style.transition = 'transform .32s var(--ease), opacity .32s';
      flip.style.transform = 'translate(' + (dx * 70) + 'px,' + (dx === 0 ? 30 : -10) + 'px) rotate(' + (dx * 6) + 'deg)';
      flip.style.opacity = '0';
    }
    setTimeout(function () {
      s.grading = false;
      nextItem();
      if (S.view === 'study') render();
    }, flip ? 230 : 0);
  }
  /* Dragging the card. The browser must not handle touches on it (touch-action: none in the CSS), or it cancels
     the drag partway. So up-and-down moves scroll the long card or the page by hand here. */
  function wireSwipe(flip, kind) {
    var SWIPE = 70, FLICK = 30, FLICK_SPEED = 0.2;
    var sx = 0, sy = 0, dx = 0, lastY = 0, startAt = 0, active = false, moved = false, vertical = false, wandered = false, canScroll = false;
    var hl = $('.swipe-hint.l', flip), hr = $('.swipe-hint.r', flip);
    function resetCard() {
      flip.style.transition = 'transform .3s var(--ease)';
      flip.style.transform = '';
      hl.style.opacity = 0; hr.style.opacity = 0;
    }
    function activeFace() { return $(flip.classList.contains('flipped') ? '.face.back' : '.face.front', flip); }
    function answeringTf() { var c = S.study && S.study.cur; return kind === 'tf' && c && !c.revealed && !c.verdict; }
    flip.addEventListener('pointerdown', function (e) {
      if (e.target.closest('input,button,form')) return;
      var fc = activeFace();
      canScroll = !!(fc && fc.scrollHeight > fc.clientHeight + 1) || document.documentElement.scrollHeight > window.innerHeight + 1;
      active = true; moved = false; vertical = false; wandered = false; sx = e.clientX; sy = lastY = e.clientY; dx = 0; startAt = Date.now();
      try { flip.setPointerCapture(e.pointerId); } catch (x) {}
    });
    flip.addEventListener('pointermove', function (e) {
      if (!active || !S.study || !S.study.cur) return;
      dx = e.clientX - sx;
      var dy = e.clientY - sy;
      if (!moved && !vertical) {
        if (Math.abs(dy) > 12) wandered = true;
        if (Math.abs(dx) > 8 && Math.abs(dx) >= Math.abs(dy) * 0.6) moved = true;
        else if (canScroll && Math.abs(dy) > 26) vertical = true;
      }
      if (vertical) {
        var face = activeFace(), step = lastY - e.clientY;
        if (face && face.scrollHeight > face.clientHeight) face.scrollTop += step; else window.scrollBy(0, step);
        lastY = e.clientY;
        return;
      }
      var cur = S.study.cur;
      if (!moved || !(cur.revealed || answeringTf())) return;
      if (cur.revealed) {
        var opts = dockChoices(S.study);
        hl.textContent = opts[0].label; hr.textContent = opts[opts.length - 1].label;
        hl.classList.remove('neutral'); hr.classList.remove('neutral');
      }
      flip.style.transition = 'none';
      flip.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
      hl.style.opacity = Math.max(0, Math.min(1, -dx / SWIPE));
      hr.style.opacity = Math.max(0, Math.min(1, dx / SWIPE));
    });
    flip.addEventListener('pointerup', function () {
      if (!active) return;
      active = false;
      var s = S.study;
      if (!s || !s.cur || vertical) return;
      if (!moved) {
        if (wandered) return;
        if (!s.cur.revealed && kind === 'basic') reveal();
        else if (s.cur.revealed) flip.classList.toggle('flipped');
        return;
      }
      var far = Math.abs(dx);
      var enough = far > SWIPE || (far > FLICK && far / Math.max(1, Date.now() - startAt) > FLICK_SPEED);
      if (answeringTf() && enough) { resetCard(); pickTf(dx < 0); return; }
      if (s.cur.revealed && enough) {
        var ch = dockChoices(s), g = ch.length === 1 ? ch[0].g : (dx > 0 ? ch[1].g : ch[0].g);
        grade(g, dx > 0 ? 3 : -3); return;
      }
      resetCard();
    });
    flip.addEventListener('pointercancel', function () { if (active) { active = false; resetCard(); } });
  }
  function editCurrent() {
    var s = S.study;
    if (!s || !s.cur) return;
    var item = s.cur.item;
    openCardEditor(item.card, item.card.deckId, function (card) {
      if (!card) { nextItem(); }
      else if (item.card.type === 'choice') s.cur.options = choiceOptions(item);
      if (S.view === 'study') render();
    });
  }
  function endStudy() {
    var s = S.study;
    var back = s && s.from === 'deck' && deckById(S.deckId) ? 'deck' : 'home';
    S.study = null;
    go(back);
  }
  function renderDone(app) {
    var s = S.study;
    var mins = Math.max(1, Math.round((Date.now() - s.started) / 60000));
    var acc = s.n ? Math.round(100 * s.correct / s.n) : 0;
    var nextLearn = s.learn.length ? prog(s.learn[0].card, s.learn[0].dir).due : 0;
    app.innerHTML = '<div class="study"><div class="wrap"><div class="done appear">' +
      '<div class="burst chroma">' + I.check + '</div><h1>' + (s.free ? s.label + ' done' : 'Mission complete') + '</h1>' +
      '<p class="hint" style="font-size:15px">' + (s.simple ? 'You finished ' + plural(s.done, 'card') + ', ' + s.firstTry + ' with no wrong answers' + (s.skipped ? ', ' + s.skipped + ' skipped' : '') + '. Stages stay as they were.' : s.free ? plural(s.doneToday, 'card') + ' moved up a stage. They come back when they are due.' : nextLearn ? plural(s.learn.length, 'card') + ' still learning. They come back in about ' + Math.max(1, Math.round((nextLearn - Date.now()) / 60000)) + ' min.' : 'Nice work. Everything due here is done.') + '</p>' +
      '<div class="done-stats"><div><b>' + s.n + '</b><span>Answers</span></div><div><b>' + acc + '%</b><span>Correct</span></div><div><b>' + mins + 'm</b><span>Time</span></div></div>' +
      '<div class="row" style="justify-content:center"><button class="btn primary lg" data-fin>Done</button></div></div></div></div>';
    $('[data-fin]', app).addEventListener('click', endStudy);
    flush();
  }

  /* ================= keyboard ================= */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (openModals.length) { openModals[openModals.length - 1].close(); return; }
      closeMenus();
      if (S.view === 'study') endStudy();
      return;
    }
    if (openModals.length || S.view !== 'study' || !S.study || !S.study.cur) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
    var s = S.study, cur = s.cur;
    if (typing) return;
    if (!cur.revealed) {
      if (cur.options && /^[1-4]$/.test(e.key)) { e.preventDefault(); pick(Number(e.key) - 1); return; }
      if (cardKind(cur.item.card, s) === 'tf') {
        if (e.key === 'o' || e.key === 'O' || e.key === 'ArrowLeft') { e.preventDefault(); pickTf(true); return; }
        if (e.key === 'x' || e.key === 'X' || e.key === 'ArrowRight') { e.preventDefault(); pickTf(false); return; }
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); return; }
      }
      if ((e.key === ' ' || e.key === 'Enter') && cur.item.card.type !== 'typed' && !(cur.options)) { e.preventDefault(); reveal(); return; }
    } else {
      var ch = dockChoices(s);
      var idx = e.key === '1' || e.key === 'ArrowLeft' ? 0 : e.key === '2' || e.key === 'ArrowRight' ? 1 : -1;
      if (idx >= 0) { e.preventDefault(); grade(ch[ch.length === 2 ? idx : 0].g); return; }
      if (e.key === ' ') { e.preventDefault(); var fl = $('[data-flip]'); if (fl) fl.classList.toggle('flipped'); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        var sg = ch.filter(function (o) { return o.sug; })[0];
        grade(ch.length === 1 ? ch[0].g : sg ? sg.g : 'right'); return;
      }
    }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); skipCard(); return; }
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); editCurrent(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target;
    if (t && t.classList && t.classList.contains('deck') && (t.hasAttribute('data-id') || t.hasAttribute('data-folder'))) { e.preventDefault(); t.click(); }
  });

  window.addEventListener('beforeunload', function () { savePending(); cacheNow(); });
  boot();
})();

</script>
</body>
